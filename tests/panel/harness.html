<!doctype html>
<meta charset="utf-8">
<title>Dusky panel harness</title>
<style>body{margin:0;font-family:Roboto,sans-serif;background:#fafafa}
:root{--primary-color:#03a9f4;--app-header-background-color:#03a9f4}</style>
<body>
<script type="module">
window.__errs = [];
addEventListener("error", (e) => window.__errs.push(e.message));
addEventListener("unhandledrejection", (e) => window.__errs.push(String(e.reason)));
import { shape } from "../../custom_components/duskylights/frontend/dusky-panel.js";
const q = new URLSearchParams(location.search);
const frames = [];
if (q.get("anim") || q.get("select")) window.requestAnimationFrame = (cb) => (frames.push(cb), frames.length);  // the test turns the crank itself
let clock = 0;
const pump = (ms) => { for (let t = 0; t < ms; t += 16) { clock += 16; const run = frames.splice(0); run.forEach((cb) => cb(clock)); } };
if (q.get("mode") === "parity") {
  const cases = JSON.parse(q.get("cases"));
  document.body.innerHTML = '<pre id="out">' + JSON.stringify(cases.map(([x, a, b]) => shape(x, a, b))) + "</pre>";
} else {
  if (q.get("dark")) {
    document.body.style.background = "#111";
    Object.entries({ "--primary-background-color": "#111", "--card-background-color": "#1c1c1c", "--primary-text-color": "#e1e1e1",
      "--secondary-text-color": "#9b9b9b", "--divider-color": "#3a3a3a" }).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  }
  const num = (v, min, max, step, unit) => ({ state: String(v), attributes: { min, max, step, unit_of_measurement: unit } });
  const states = {
    "number.dusky_start_elevation": num(10, -20, 40, 0.5, "°"),
    "number.dusky_end_elevation": num(-6, -30, 20, 0.5, "°"),
    "number.dusky_high": num(50, 1, 100, 1, "%"),
    "number.dusky_low": num(10, 1, 100, 1, "%"),
    "number.dusky_start_sharpness": num(0, 0, 3, 0.1, null),
    "number.dusky_end_sharpness": num(0, 0, 3, 0.1, null),
    "number.dusky_living_high": num(0, 0, 100, 1, "%"),
    "number.dusky_living_low": num(0, 0, 100, 1, "%"),
    "number.dusky_kitchen_high": num(70, 0, 100, 1, "%"),
    "number.dusky_kitchen_low": num(20, 0, 100, 1, "%"),
    "sensor.dusky_sun_elevation": { state: q.get("elev") || "3.2", attributes: {} },
    "sensor.dusky_living_target": { state: "29.4", attributes: { holding: false, demo: false } },
    "sensor.dusky_kitchen_target": { state: "42.8", attributes: { holding: true, hold_brightness: 90, demo: false } },
    "light.living": { state: "on", attributes: { brightness: 76, friendly_name: "Living lights" } },
    "light.kitchen": { state: "on", attributes: { brightness: 90, friendly_name: "Kitchen lights" } },
    "switch.dusky_demo": { state: "off", attributes: {} },
    "select.dusky_demo_light": { state: "Living lights", attributes: { options: ["Living lights", "Kitchen lights"] } },
    "select.dusky_demo_repeat": { state: "Once", attributes: { options: ["Once", "Loop"] } },
    "number.dusky_demo_length": num(0, 0, 600, 1, "s"),
  };
  const info = {
    settings: { start_elevation: "number.dusky_start_elevation", end_elevation: "number.dusky_end_elevation", normal_pct: "number.dusky_high",
      floor_pct: "number.dusky_low", sharp_start: "number.dusky_start_sharpness", sharp_end: "number.dusky_end_sharpness" },
    lights: [
      { light: "light.living", name: "Living lights", high: "number.dusky_living_high", low: "number.dusky_living_low", release: "button.dusky_living_release", target: "sensor.dusky_living_target" },
      { light: "light.kitchen", name: "Kitchen lights", high: "number.dusky_kitchen_high", low: "number.dusky_kitchen_low", release: "button.dusky_kitchen_release", target: "sensor.dusky_kitchen_target" },
    ],
    candidates: [{ light: "light.garage", name: "Garage lights" }, { light: "light.office", name: "Office lights" }, { light: "light.porch", name: "Porch" }],
    release_all: "button.dusky_release_all", elevation: "sensor.dusky_sun_elevation",
    demo: { switch: "switch.dusky_demo", light: "select.dusky_demo_light", repeat: "select.dusky_demo_repeat", length: "number.dusky_demo_length" },
  };
  if (q.get("unavail")) {
    for (const id of ["number.dusky_high", "number.dusky_low", "number.dusky_start_sharpness", "sensor.dusky_living_target", "switch.dusky_demo", "light.living"])
      states[id] = { state: "unavailable", attributes: {} };
    states["sensor.dusky_sun_elevation"] = { state: "unknown", attributes: {} };
  }
  if (q.get("nolights")) info.lights = [];
  // a day at a place where the sun peaks at 32 degrees: elev = 40 cos(2 pi (h - 12) / 24) - 8
  const day0 = Date.UTC(2026, 5, 21);
  const sunPath = () => ({
    start: day0, step_s: 120,
    elevations: Array.from({ length: 720 }, (_, i) => (q.get("polar") ? 30 : Math.round((40 * Math.cos((2 * Math.PI * (i / 30 - 12)) / 24) - 8) * 100) / 100)),
  });
  const el = document.createElement("dusky-panel");
  window.calls = [];
  const hass = () => ({
    config: { time_zone: "UTC" },
    locale: { language: "en-GB", time_format: "24" },
    states: { ...states },
    callWS: async (m) => {
      if (m.type === "duskylights/info") return info;
      if (m.type === "duskylights/sun_path") return sunPath();
      window.calls.push(["ws", m.type, m]);
      return null;
    },
    callService: async (d, s, data) => {
      window.calls.push([d, s, data]);
      if (d === "number" && s === "set_value") states[data.entity_id] = { ...states[data.entity_id], state: String(data.value) };
      el.hass = hass();
    },
  });
  document.body.appendChild(el);
  el.hass = hass();
  window.panel = el;
  if (q.get("act")) {
    await new Promise((r) => setTimeout(r, 200));
    const r = el._rows;
    r.normal_pct.num.value = "60"; r.normal_pct.num.dispatchEvent(new Event("change"));
    r.start_elevation.range.value = "12"; r.start_elevation.range.dispatchEvent(new Event("input"));
    const rows = el.shadowRoot.querySelectorAll("#lights tbody tr");
    rows[0].querySelector(".hi").value = "65"; rows[0].querySelector(".hi").dispatchEvent(new Event("change"));
    const sr = el.shadowRoot;
    window.beforeSave = window.calls.length;               // nothing may be written yet
    sr.getElementById("dGo").click();                       // preview the unsaved values on one light
    await new Promise((r) => setTimeout(r, 50));
    sr.getElementById("discard").click();                   // drop them...
    r.normal_pct.num.value = "55"; r.normal_pct.num.dispatchEvent(new Event("change"));
    sr.getElementById("save").click();                      // ...and save just one change
    rows[1].querySelector(".rel").click();
    sr.getElementById("releaseAll").click();
    await new Promise((r) => setTimeout(r, 100));
    const out = document.createElement("pre"); out.id = "out"; out.textContent = JSON.stringify({ calls: window.calls, beforeSave: window.beforeSave, errors: window.__errs });
    document.body.appendChild(out);
  }
  if (q.get("select")) {
    await new Promise((r) => setTimeout(r, 200));
    const sr = el.shadowRoot, snap = () => [...sr.querySelectorAll("#graph svg path")].map((p) => p.getAttribute("d"));
    const before = snap();
    sr.querySelectorAll("#lights tbody tr td")[0].click();            // pick the first light
    const picked = snap(), legend = sr.getElementById("legend").textContent;
    const hi = sr.querySelector("#lights tbody tr .hi");
    hi.value = "90"; hi.dispatchEvent(new Event("change"));           // edit its High: the chart must move
    pump(1200);                                                         // ...smoothly, so give it time to land
    const edited = snap(), legend2 = sr.getElementById("legend").textContent;
    sr.querySelectorAll("#lights tbody tr td")[0].click();            // click again: back to all lights
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({ errors: window.__errs, before, picked, edited, legend, legend2, back: snap(), sel: el._sel });
    document.body.appendChild(out);
  }
  if (q.get("tip")) {
    await new Promise((r) => setTimeout(r, 200));
    const sr = el.shadowRoot, tip = sr.getElementById("tip");
    const inp = sr.querySelector("#lights tbody tr .hi");
    inp.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, composed: true }));
    const early = getComputedStyle(tip).display;                    // not yet: the delay keeps it out of the way
    await new Promise((r) => setTimeout(r, 800));
    const shown = getComputedStyle(tip).display, text = tip.textContent, w = tip.getBoundingClientRect().width;
    if (!q.get("keep")) inp.dispatchEvent(new MouseEvent("mouseout", { bubbles: true, composed: true }));
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({ errors: window.__errs, early, shown, text, w, after: getComputedStyle(tip).display, native: [...sr.querySelectorAll("[title]")].length });
    document.body.appendChild(out);
  }
  if (q.get("combo")) {
    await new Promise((r) => setTimeout(r, 200));
    const inp = el.shadowRoot.getElementById("addIn");
    inp.focus(); inp.value = "li"; inp.dispatchEvent(new Event("input"));
    inp.scrollIntoView({ block: "center" });
  }
  if (q.get("anim")) {
    await new Promise((r) => setTimeout(r, 200));
    const sr = el.shadowRoot, d = () => sr.querySelector("#graph svg path[stroke-width='4']").getAttribute("d");
    const start = d();
    const r = el._rows; r.normal_pct.num.value = "90"; r.normal_pct.num.dispatchEvent(new Event("change"));
    const t0 = d(); pump(64); const mid = d(); pump(1200); const end = d();
    const live = !!el._raf; pump(160); const settled = d();
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({ errors: window.__errs, start, t0, mid, end, settled, raf: live });
    document.body.appendChild(out);
  }
  if (q.get("view")) {
    await new Promise((r) => setTimeout(r, 200));
    el.shadowRoot.querySelectorAll("#lights tbody tr td:first-child")[1].click();
  }
  if (q.get("perlight")) {
    await new Promise((r) => setTimeout(r, 200));
    const sr = el.shadowRoot, rows = () => el._rows;
    const names = sr.querySelectorAll("#lights tbody tr td:first-child");
    const view = (key) => ({ disabled: rows()[key].num.disabled && rows()[key].range.disabled, tip: rows()[key].row.getAttribute("data-tip"),
      inherited: rows()[key].row.classList.contains("inh"), lnkHidden: rows()[key].lnk.hidden, shows: rows()[key].num.value });
    const before = { title: sr.getElementById("setTitle").textContent, setAll: sr.getElementById("setAll").hidden, start: view("start_elevation") };
    names[1].click();                                                       // kitchen: High 70, Low 20 of its own
    const picked = { title: sr.getElementById("setTitle").textContent, setAll: sr.getElementById("setAll").hidden,
      start: view("start_elevation"), sharp: view("sharp_end"), high: view("normal_pct"), low: view("floor_pct") };
    rows().normal_pct.num.value = "85"; rows().normal_pct.num.dispatchEvent(new Event("change"));
    const mid = { draft: { ...el._draft } };
    rows().floor_pct.lnk.click();                                           // Use default on Night
    const reset = { draft: { ...el._draft } };
    sr.getElementById("dGo").click();
    await new Promise((r) => setTimeout(r, 50));
    const preview = (window.calls.find((c) => c[1] === "duskylights/demo") || [])[2];
    sr.getElementById("save").click();
    await new Promise((r) => setTimeout(r, 50));
    names[0].click();                                                       // living has none of its own
    const living = { high: view("normal_pct") };
    sr.getElementById("setAll").click();
    const back = { title: sr.getElementById("setTitle").textContent, setAll: sr.getElementById("setAll").hidden, start: view("start_elevation") };
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({ errors: window.__errs, before, picked, mid, reset, preview, living, back, calls: window.calls });
    document.body.appendChild(out);
  }
  if (q.get("limits")) {
    await new Promise((r) => setTimeout(r, 200));
    const sr = el.shadowRoot, r = el._rows, type = (row, v) => { row.num.value = String(v); row.num.dispatchEvent(new Event("change")); };
    const snap = () => ({ ...el._draft }), res = {};
    type(r.start_elevation, -10);                    // start below end (-6): end must follow
    res.startDown = snap(); res.note1 = sr.getElementById("setNote").textContent;
    el._draft = {};
    type(r.end_elevation, 15);                       // end above start (10): start must follow
    res.endUp = snap();
    el._draft = {};
    type(r.floor_pct, 80);                           // Night brighter than Day (50): Day follows
    res.nightUp = snap();
    el._draft = {};
    type(r.normal_pct, 5);                           // Day dimmer than Night (10): Night follows
    res.dayDown = snap();
    el._draft = {};
    type(r.end_elevation, 20); type(r.start_elevation, 20);   // dragging start onto end: end gives way
    res.atLimit = snap();
    el._draft = {};
    const lo = sr.querySelectorAll("#lights tbody tr")[1].querySelector(".lo");    // kitchen: Day 70, Night 20
    lo.value = "90"; lo.dispatchEvent(new Event("change"));
    res.light = snap();
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({ errors: window.__errs, ...res });
    document.body.appendChild(out);
  }
  if (q.get("manage")) {
    await new Promise((r) => setTimeout(r, 200));
    const sr = el.shadowRoot;
    window.confirm = () => true;
    const addDisabledBefore = sr.getElementById("addBtn").disabled;      // nothing picked yet
    const inp = sr.getElementById("addIn"), names = () => [...sr.querySelectorAll("#addList li")].map((li) => li.textContent);
    const type = (v) => { inp.value = v; inp.dispatchEvent(new Event("input")); };
    inp.dispatchEvent(new Event("focus"));
    const all = names();
    type("FFI"); const bySubstring = names();             // middle of a name, any case
    type("light.por"); const byEntity = names();           // entity id works too
    type("zzz"); const noMatch = names();
    type("lights");
    inp.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }));
    inp.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));   // second match = Office lights
    window.found = { all, bySubstring, byEntity, noMatch, value: inp.value };
    window.addState = [addDisabledBefore, sr.getElementById("addBtn").disabled];
    sr.getElementById("addBtn").click();
    await new Promise((r) => setTimeout(r, 100));
    sr.querySelector("#lights tbody tr .rm").click();
    await new Promise((r) => setTimeout(r, 100));
    // with unsaved edits the add/remove controls lock
    el._rows.normal_pct.num.value = "60"; el._rows.normal_pct.num.dispatchEvent(new Event("change"));
    const locked = sr.getElementById("addBtn").disabled && sr.querySelector("#lights .rm").disabled;
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({ errors: window.__errs, calls: window.calls, locked, addState: window.addState, found: window.found });
    document.body.appendChild(out);
  }
  if (q.get("probe") || q.get("garbage")) {
    await new Promise((r) => setTimeout(r, 300));
    const sr = el.shadowRoot;
    if (q.get("garbage") && el._rows) {
      const r = el._rows;
      const type = (inp, v) => { inp.value = v; inp.dispatchEvent(new Event("change")); };
      type(r.normal_pct.num, "999");      // far above the maximum
      type(r.floor_pct.num, "-5");        // below the minimum
      type(r.end_elevation.num, "abc");   // not a number at all (a number box drops it to "")
      type(r.start_elevation.num, "");    // empty
      const rows = sr.querySelectorAll("#lights tbody tr");
      type(rows[0].querySelector(".hi"), "250");
      type(rows[0].querySelector(".lo"), "");   // cleared = back to global
      sr.getElementById("save").click();
      await new Promise((r) => setTimeout(r, 100));
    }
    const out = document.createElement("pre"); out.id = "out";
    out.textContent = JSON.stringify({
      errors: window.__errs, calls: window.calls,
      svg: [...sr.querySelectorAll("svg text")].map((t) => t.textContent),
      times: (sr.getElementById("times") || {}).textContent,
      note: (sr.getElementById("demoNote") || {}).textContent,
      goDisabled: (sr.getElementById("dGo") || {}).disabled,
      rendered: !!sr.querySelector("svg path"),
      bands: [...sr.querySelectorAll("#graph g.band")].map((g) => ({ tip: g.getAttribute("data-tip"), label: (g.querySelector("text") || {}).textContent, shade: g.querySelector("rect").getAttribute("fill-opacity") })),
      endBox: el._rows ? el._rows.end_elevation.num.value : null,
    });
    document.body.appendChild(out);
  }
}
</script>
