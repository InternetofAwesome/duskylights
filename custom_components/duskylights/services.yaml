release:
  fields:
    entity_id:
      selector:
        entity:
          domain: light
          multiple: true
demo:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: light
    duration:
      default: 10
      selector:
        number:
          min: 0.05
          max: 1440
          step: 0.05
          unit_of_measurement: min
    date:
      selector:
        date:
    start_hour:
      default: 12
      selector:
        number:
          min: 0
          max: 24
          step: 0.5
    loop:
      default: false
      selector:
        boolean:
demo_stop:
